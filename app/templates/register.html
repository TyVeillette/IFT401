{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <h2 class="text-center my-4">
            Create Account
        </h2>

        <form method="POST" class="card card-body">

            <div class="mb-3">
                <label for="full_name" class="form-label">
                    Full Name
                </label>

                <input
                    id="full_name"
                    name="full_name"
                    type="text"
                    class="form-control"
                    maxlength="100"
                    value="{{ form.get('full_name', '') }}"
                    autocomplete="name"
                    required
                    autofocus>
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    class="form-control"
                    maxlength="50"
                    pattern="[A-Za-z0-9_.\-]+"
                    value="{{ form.get('username', '') }}"
                    autocomplete="username"
                    required>

                <div class="form-text">
                    Letters, numbers, periods, hyphens and underscores.
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    class="form-control"
                    maxlength="120"
                    value="{{ form.get('email', '') }}"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    class="form-control"
                    minlength="8"
                    autocomplete="new-password"
                    required>

                <div class="form-text">
                    At least 8 characters.
                </div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">
                    Confirm Password
                </label>

                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    class="form-control"
                    minlength="8"
                    autocomplete="new-password"
                    required>
            </div>

            <button type="submit" class="btn btn-primary">
                Create Account
            </button>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="{{ url_for('pages.login') }}">Sign in</a>
        </p>

    </div>

</div>

{% endblock %}
