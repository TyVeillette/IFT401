{% extends "base.html" %}

{% block title %}Create Stock{% endblock %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-8 col-lg-6">

<h2 class="mb-4">Create Stock</h2>

<form method="POST" class="card card-body">

    <div class="mb-3">
        <label for="ticker" class="form-label">
            Stock Ticker
        </label>

        <input
            id="ticker"
            name="ticker"
            type="text"
            class="form-control"
            maxlength="10"
            placeholder="Enter stock ticker"
            value="{{ form.get('ticker', '') }}"
            required>
    </div>

    <div class="mb-3">
        <label for="company_name" class="form-label">
            Stock Name
        </label>

        <input
            id="company_name"
            name="company_name"
            type="text"
            class="form-control"
            placeholder="Enter stock name"
            value="{{ form.get('company_name', '') }}"
            required>
    </div>

    <div class="mb-3">
        <label for="initial_price" class="form-label">
            Initial Price
        </label>

        <input
            id="initial_price"
            name="initial_price"
            type="number"
            class="form-control"
            min="0.01"
            step="0.01"
            placeholder="Enter initial price"
            value="{{ form.get('initial_price', '') }}"
            required>
    </div>

    <div class="mb-3">
        <label for="volume" class="form-label">
            Initial Volume
        </label>

        <input
            id="volume"
            name="volume"
            type="number"
            class="form-control"
            min="0"
            step="1"
            placeholder="Enter initial volume"
            value="{{ form.get('volume', '') }}"
            required>
    </div>

    <div class="row">

        <div class="col-sm-6 mb-3">
            <label for="exchange" class="form-label">
                Exchange <span class="text-body-secondary">(optional)</span>
            </label>

            <input
                id="exchange"
                name="exchange"
                type="text"
                class="form-control"
                maxlength="20"
                value="{{ form.get('exchange', '') }}">
        </div>

        <div class="col-sm-6 mb-3">
            <label for="sector" class="form-label">
                Sector <span class="text-body-secondary">(optional)</span>
            </label>

            <input
                id="sector"
                name="sector"
                type="text"
                class="form-control"
                maxlength="100"
                value="{{ form.get('sector', '') }}">
        </div>

    </div>

    <button type="submit" class="btn btn-primary">
        Create Stock
    </button>

</form>

</div>

</div>

{% endblock %}
