<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Trading System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .page {
            width: 96%;
            max-width: 1320px;
            min-height: 1055px;
            margin: 25px auto;
            border: 3px solid #222;
            border-radius: 6px;
        }

        /* Header */
        .header {
            height: 94px;
            background: #f3f3f3;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 115px;
            font-size: 20px;
        }

        .header-title {
            font-weight: bold;
        }

        /* Main content */
        main {
            padding: 50px 58px;
        }

        .page-title {
            margin-left: 190px;
            font-size: 21px;
        }

        /* Current schedule */
        .current-schedule {
            width: 78%;
            margin-top: 54px;
            margin-bottom: 42px;

            border: 2px solid #aaa;
            border-radius: 7px;

            text-align: center;
            padding: 24px;

            font-size: 20px;
            line-height: 1.45;
        }

        .current-schedule h3 {
            margin: 0 0 28px;
        }

        /* Form */
        .schedule-form {
            width: 72%;
            margin-left: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 260px 1fr;
            align-items: center;

            margin: 46px 0;
            font-size: 20px;
        }

        .form-row > label {
            text-align: center;
            font-weight: 600;
        }

        .input-box {
            height: 67px;

            border: 2px solid #999;
            border-radius: 7px;
            background-color: #fafafa;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .holiday-control {
            border: none;
            background: white;
        }

        .holiday-control label {
            margin-left: 10px;
        }

        /* Success box */
        .success-message {
            width: 78%;

            margin-top: 150px;

            border: 2px solid #aaa;
            border-radius: 7px;

            padding: 18px;
            text-align: center;

            font-size: 20px;
        }

        .footer-message {
            margin-top: 45px;
            text-align: center;
            font-size: 20px;
        }

        /* Smaller screens */
        @media (max-width: 800px) {

            .header {
                padding: 0 25px;
            }

            main {
                padding: 35px 25px;
            }

            .page-title {
                margin-left: 0;
            }

            .current-schedule,
            .success-message {
                width: 100%;
            }

            .schedule-form {
                width: 100%;
                margin-left: 0;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
                margin: 28px 0;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">
        <div class="header-title">
            Stock Trading System
        </div>

        <nav>
            Market Schedule | Admin | Sign Out
        </nav>
    </header>

    <main>

        <div class="page-title">
            Change Market Schedule
        </div>

        <section class="current-schedule">

            <h3>Current Market Schedule</h3>

            <div>
                Date: September 1, 2026
            </div>

            <div>
                Day: Tuesday
            </div>

        </section>

        <div class="schedule-form">

            <div class="form-row">

                <label>
                    Simulated Market Date
                </label>

                <div class="input-box">
                    09/01/2026
                </div>

            </div>

            <div class="form-row">

                <label>
                    Simulated Market Day
                </label>

                <div class="input-box">
                    Tuesday
                </div>

            </div>

            <div class="form-row">

                <label>
                    Market Holiday
                </label>

                <div class="input-box holiday-control">

                    <input
                        type="checkbox"
                        id="holiday"
                        name="holiday"
                    >

                    <label for="holiday">
                        Enable Holiday
                    </label>

                </div>

            </div>

        </div>

        <div class="success-message">
            Market schedule updated successfully.
        </div>

        <div class="footer-message">
            Holiday dates prevent order execution.
        </div>

    </main>

</div>

</body>
</html>
