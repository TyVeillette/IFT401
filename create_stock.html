<body>

<main*class="frame">

    <header class=*topbar">

        <div class="brand">
            Stock Trading System
        </div>

        <nav class="nav">
            #Stocks</a>
            |
            #Admin</a>
            |
            #Sign Out</a>
        </nav>

    </header>


    <section class="content">

        <form
            class="form-area"
            method="POST"
        >

            <h2>Create Stock</h2>


            <div class="field">

                <label for="ticker">
                    Stock Ticker
                </label>

                <input
                    id="ticker"
                    name="ticker"
                    type="text"
                    placeholder="Enter stock ticker"
                    value="{{ ticker }}"
                    required
                >

                {% if error %}
                    <div class="error">
                        {{ error }}
                    </div>
                {% endif %}

            </div>


            <div class="field">

                <label for="name">
                    Stock Name
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Enter stock name"
                    required
                >

            </div>


            <div class="field">

                <label for="price">
                    Initial Price
                </label>

                <input
                    id="price"
                    name="price"
                    type="number"
                    min="0.01"
                    step="0.01"
                    placeholder="Enter initial price"
                    required
                >

            </div>


            <div class="field">

                <label for="volume">
                    Initial Volume
                </label>

                <input
                    id="volume"
                    name="volume"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="Enter initial volume"
                    required
                >

            </div>


            <!--
            The screenshot does not show a submit button.
            Pressing Enter in an input will submit the form.
            -->
            <button type="submit" hidden>
                Create Stock
            </button>

        </form>


        {% if success %}

            <div class="notice">
                Stock successfully added to market board.
            </div>

        {% else %}

            <div
                class="notice"
                style="visibility: hidden;"
            >
                Stock successfully added to market board.
            </div>

        {% endif %}


        <p class="audit">
            Each stock creation is recorded in the
            administrator audit log.
        </p>

    </section>

</main>
